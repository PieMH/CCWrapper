name: Bug report
description: Something in CCWrapper does not work as it should
labels: [bug]
body:
  - type: input
    id: app-version
    attributes:
      label: CCWrapper version
      description: Shown under the name in the About window.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: logs
    attributes:
      label: Logs, error text or screenshots
      description: "Optional. Remove anything private first: file paths, e-mail addresses, prompts, code and session content."
      render: text
